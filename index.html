<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋日画卷 · Autumn Gallery</title>
    <style>
        :root {
            --primary: #c25929;
            --primary-light: #fbeee6;
            --accent: #d97736;
            --text-dark: #2c2523;
            --text-muted: #7d726d;
            --bg-gradient: linear-gradient(135deg, #fbf7f4 0%, #f7ece1 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 30px rgba(160, 82, 45, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 背景落叶 Canvas */
        #leaves-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 页面容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 24px 80px;
            position: relative;
            z-index: 2;
        }

        /* 头部介绍 */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        /* 照片画廊网格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* 卡片设计 */
        .gallery-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(160, 82, 45, 0.15);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background: #ede3da;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .img-wrapper img {
            transform: scale(1.06);
        }

        .img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-card:hover .img-overlay {
            opacity: 1;
        }

        .view-btn {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 卡片内容信息 */
        .card-body {
            padding: 20px 24px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-file {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 14px;
            display: inline-block;
        }

        /* 放大查看遮罩 (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(18, 14, 12, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            text-align: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .lightbox-caption {
            color: #f7ece1;
            margin-top: 14px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.2rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .container { padding: 30px 16px 60px; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 飘落的枫叶动画 Canvas -->
    <canvas id="leaves-canvas"></canvas>

    <div class="container">
        <header>
            <div class="tag">AUTUMN ALBUM</div>
            <h1>层林尽染 · 秋日图景</h1>
            <p class="subtitle">采集金秋微风与暖阳，记录每一帧如画的风景</p>
        </header>

        <!-- 照片展示区域 (自动读取当前目录的 2.png, 3.png, xx.png) -->
        <main class="gallery-grid">
            
            <!-- 卡片 1: 2.png -->
            <div class="gallery-card" onclick="openLightbox('2.png', '秋林步道 · 2.png')">
                <div class="img-wrapper">
                    <img src="2.png" alt="秋日景象 2.png" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80';">
                    <div class="img-overlay">
                        <span class="view-btn">点击查看大图</span>
                    </div>
                </div>
                <div class="card-body">
                    <div>
                        <h2 class="card-title">枫林小溪</h2>
                        <p class="card-desc">静谧林间穿流而过的溪水，倒映着金黄交织的树梢。</p>
                    </div>
                    <span class="card-file">📄 2.png</span>
                </div>
            </div>

            <!-- 卡片 2: 3.png -->
            <div class="gallery-card" onclick="openLightbox('3.png', '溪涧落枫 · 3.png')">
                <div class="img-wrapper">
                    <img src="3.png" alt="秋日景象 3.png" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1477414348463-c0eb7f1359b6?auto=format&fit=crop&w=1000&q=80';">
                    <div class="img-overlay">
                        <span class="view-btn">点击查看大图</span>
                    </div>
                </div>
                <div class="card-body">
                    <div>
                        <h2 class="card-title">层林与漫步</h2>
                        <p class="card-desc">金秋时节的山峦与步道，远眺漫山红遍的壮丽景致。</p>
                    </div>
                    <span class="card-file">📄 3.png</span>
                </div>
            </div>

            <!-- 卡片 3: xx.png -->
            <div class="gallery-card" onclick="openLightbox('xx.png', '山径漫行 · xx.png')">
                <div class="img-wrapper">
                    <img src="xx.png" alt="秋日景象 xx.png" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=80';">
                    <div class="img-overlay">
                        <span class="view-btn">点击查看大图</span>
                    </div>
                </div>
                <div class="card-body">
                    <div>
                        <h2 class="card-title">秋意暖阳</h2>
                        <p class="card-desc">阳光穿透红叶洒向蜿蜒小道，伴随微风享受惬意的秋日时光。</p>
                    </div>
                    <span class="card-file">📄 xx.png</span>
                </div>
            </div>

        </main>
    </div>

    <!-- 大图查看弹窗 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="close-btn" onclick="closeLightbox(event)">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="大图查看" class="lightbox-img" id="lightbox-img">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <script>
        // --- 1. 大图弹出交互 ---
        function openLightbox(src, caption) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const cap = document.getElementById('lightbox-caption');
            img.src = src;
            cap.innerText = caption;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox' || e.target.classList.contains('close-btn')) {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // 按 ESC 键关闭大图
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // --- 2. 枫叶飘落背景动效 ---
        const canvas = document.getElementById('leaves-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const leafColors = ['#d95328', '#e27b2a', '#e8a838', '#b53d27', '#9e341b'];
        const leaves = [];
        const LEAF_COUNT = 24;

        class Leaf {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 8 + 7;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = Math.random() * 1.5 - 0.5;
                this.angle = Math.random() * 360;
                this.spinSpeed = (Math.random() - 0.5) * 2;
                this.color = leafColors[Math.floor(Math.random() * leafColors.length)];
                this.opacity = Math.random() * 0.4 + 0.5;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.015) + this.speedX;
                this.angle += this.spinSpeed;
                if (this.y > height + 20 || this.x > width + 20 || this.x < -20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                
                // 绘制简单枫叶形小椭圆瓣
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < LEAF_COUNT; i++) {
            const leaf = new Leaf();
            leaf.y = Math.random() * height; // 初始随机分布在页面各处
            leaves.push(leaf);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            leaves.forEach(leaf => {
                leaf.update();
                leaf.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
